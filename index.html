<!doctype html>
<html lang="en" class="snap-y snap-mandatory snap-always" data-realm="aqua">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon
         Aqua is the default realm. The realm script that vite.config.ts
         injects into this <head> swaps the elements with ids below to the
         realm picked for this visit. -->
    <meta name="apple-mobile-web-app-title" content="Tim Kelso" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link id="icon-svg" rel="icon" type="image/svg+xml" href="/assets/favicon/aqua.svg" />
    <link id="icon-apple" rel="apple-touch-icon" href="/assets/favicon/apple-touch-icon-aqua.png" />
    <link rel="manifest" href="/assets/favicon/site.webmanifest" />
    <meta id="theme-color-light" name="theme-color" content="#E6EBFF" media="(prefers-color-scheme: light)" />
    <meta id="theme-color-dark" name="theme-color" content="#0F0D26" media="(prefers-color-scheme: dark)" />

    <!-- Title -->
    <title>Tim Kelso</title>
    <meta
      name="description"
      content="Frontend developer creating intuitive web applications and engaging user experiences. Explore a portfolio showcasing a passion for modern web technologies."
    />

    <!-- Style -->
    <link rel="stylesheet" href="/src/styles/tailwind.css" />
  </head>
  <body class="bg-default-bg text-default-fg">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
